name: "Chore"
description: "빌드, 설정, 의존성, 문서 등 기타 작업"
title: "[Chore] "
labels: ["chore"]
body:
  - type: input
    id: summary
    attributes:
      label: "작업 요약"
      description: "작업 내용을 간단히 작성해주세요."
      placeholder: "예: JWT 의존성 추가"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: "작업 설명"
      description: "설정 변경, 의존성 추가, 문서 수정 등의 내용을 작성해주세요."
      placeholder: |
        Spring Security 및 JWT 관련 의존성을 추가한다.
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: "작업 목록"
      value: |
        - [ ] 설정 파일 수정
        - [ ] 의존성 추가
        - [ ] 문서 수정
        - [ ] 동작 확인
    validations:
      required: true

  - type: input
    id: branch
    attributes:
      label: "브랜치명"
      placeholder: "예: chore/14-add-jwt-dependency"
    validations:
      required: false