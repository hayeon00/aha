name: "Fix"
description: "버그 수정"
title: "[Fix] "
labels: ["fix"]
body:
  - type: input
    id: summary
    attributes:
      label: "버그 요약"
      description: "발생한 버그를 간단히 작성해주세요."
      placeholder: "예: 로그인 실패 시 500 에러 발생"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: "문제 상황"
      description: "어떤 상황에서 문제가 발생했는지 작성해주세요."
      placeholder: |
        로그인 요청 시 비밀번호가 틀린 경우 401이 아닌 500 에러가 발생한다.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: "재현 방법"
      value: |
        1. 
        2. 
        3.
    validations:
      required: false

  - type: textarea
    id: tasks
    attributes:
      label: "수정 작업"
      value: |
        - [ ] 원인 파악
        - [ ] 버그 수정
        - [ ] 테스트 확인
    validations:
      required: true

  - type: input
    id: branch
    attributes:
      label: "브랜치명"
      placeholder: "예: fix/13-login-error"
    validations:
      required: false