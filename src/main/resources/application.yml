spring:
  profiles:
    active: dev

  datasource:
    url: jdbc:mysql://localhost:3306/aha?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    show-sql: true

jwt:
  secret: your-secret-key-your-secret-key-your-secret-key
  access-token-expiration: 1800000      # 30분
  refresh-token-expiration: 1209600000  # 14일

openai:
  api-key: ${OPENAI_API_KEY}
  model: gpt-4.1-mini