spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: ${JPA_FORMAT_SQL:true}
    show-sql: ${JPA_SHOW_SQL:true}

  servlet:
    multipart:
      enabled: true
      max-file-size: ${MAX_FILE_SIZE:20MB}
      max-request-size: ${MAX_REQUEST_SIZE:100MB}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:1800000}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:1209600000}

openai:
  api-key: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:gpt-4.1-mini}

file:
  profile-upload-dir: ${PROFILE_UPLOAD_DIR:uploads/profile}
  document-upload-dir: ${DOCUMENT_UPLOAD_DIR:uploads/documents}

  document:
    max-file-size: ${DOCUMENT_MAX_FILE_SIZE:20MB}
    max-total-size: ${DOCUMENT_MAX_TOTAL_SIZE:100MB}
    max-file-count: ${DOCUMENT_MAX_FILE_COUNT:5}
    max-file-name-length: ${DOCUMENT_MAX_FILE_NAME_LENGTH:255}