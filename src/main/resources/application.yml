spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:none}
    properties:
      hibernate:
        format_sql: ${JPA_FORMAT_SQL:true}
    show-sql: ${JPA_SHOW_SQL:true}

  servlet:
    multipart:
      enabled: true
      max-file-size: ${DOCUMENT_MAX_FILE_SIZE:20MB}
      max-request-size: ${DOCUMENT_MAX_FILE_SIZE:20MB}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
              - email
            client-name: Google

          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - profile_nickname
              - profile_image
              - account_email
            client-name: Kakao

        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:1800000}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:1209600000}

openai:
  api-key: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:gpt-4.1-mini}
  embedding-model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}

file:
  profile-upload-dir: ${PROFILE_UPLOAD_DIR:uploads/profile}

document:
  ocr:
    data-path: ${TESSERACT_DATA_PATH:}
    native-library-path: ${TESSERACT_NATIVE_LIBRARY_PATH:}
    language: ${TESSERACT_LANGUAGE:kor+eng}

  upload:
    directory: ${DOCUMENT_UPLOAD_DIRECTORY:uploads/documents}
    max-file-size: ${DOCUMENT_MAX_FILE_SIZE:20MB}
    max-file-name-length: ${DOCUMENT_MAX_FILE_NAME_LENGTH:255}

  processing:
    core-pool-size: ${DOCUMENT_PROCESSING_CORE_POOL_SIZE:2}
    max-pool-size: ${DOCUMENT_PROCESSING_MAX_POOL_SIZE:4}
    queue-capacity: ${DOCUMENT_PROCESSING_QUEUE_CAPACITY:20}
    keep-alive-seconds: ${DOCUMENT_PROCESSING_KEEP_ALIVE_SECONDS:60}
    await-termination-seconds: ${DOCUMENT_PROCESSING_AWAIT_TERMINATION_SECONDS:30}
    timeout-seconds: ${DOCUMENT_PROCESSING_TIMEOUT_SECONDS:60}
    retry-max-attempts: ${DOCUMENT_PROCESSING_RETRY_MAX_ATTEMPTS:3}
    retry-backoff-millis: ${DOCUMENT_PROCESSING_RETRY_BACKOFF_MILLIS:1000}

auth:
  cookie:
    http-only: true
    same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
    path: /
    refresh-token-max-age-seconds: ${REFRESH_TOKEN_MAX_AGE_SECONDS:1209600}

scheduler:
  past-paper-attempt-expiration:
    fixed-delay: 60000
