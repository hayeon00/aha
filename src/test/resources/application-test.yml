spring:
  datasource:
    url: jdbc:h2:mem:aha-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: never

  ai:
    openAI:
      api-key: sk-proj-test-key-for-context-loads-only-000000000000000000000000000000
      chat:
        options:
          model: gpt-4.1-mini

jwt:
  secret: test-jwt-secret-key-for-aha-application-minimum-32-bytes
  access-token-expiration: 3600000
  refresh-token-expiration: 1209600000

openAI:
  api-key: sk-proj-test-key-for-context-loads-only-000000000000000000000000000000
  base-url: https://api.openai.com/v1
  model: gpt-4.1-mini
  embedding-model: text-embedding-3-small

app:
  cors:
    allowed-origins: http://localhost:5173

  frontend:
    oauth-callback-url: http://localhost:5173/oauth/callback

  ai:
    openAI:
      enabled: false

  auth:
    cookie:
      secure: false